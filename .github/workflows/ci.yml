name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src tests scanner.py
      - name: Build distributions
        run: python -m build
      - name: Validate wheel contents and installed CLI
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          sdist = glob.glob("dist/*.tar.gz")
          assert len(sdist) == 1, sdist
          with tarfile.open(sdist[0], "r:gz") as archive:
              sdist_names = archive.getnames()
          root = sdist_names[0].split("/", 1)[0]
          assert f"{root}/scanner.py" in sdist_names

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
          assert "simple_port_scanner/cli.py" in names
          assert "simple_port_scanner/py.typed" in names
          PY
          python -m venv /tmp/simple-port-scanner-smoke
          /tmp/simple-port-scanner-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/simple-port-scanner-smoke/bin/simple-port-scanner --help
